name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: memoNOW-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore .\src\memoNOW\memoNOW.csproj

      - name: Build
        run: dotnet build .\src\memoNOW\memoNOW.csproj -c Release --no-restore

      - name: Publish portable EXE
        shell: pwsh
        run: .\scripts\publish-portable.ps1

      - name: Verify portable EXE
        shell: pwsh
        run: |
          $exe = '.\artifacts\memoNOW-win-x64\memoNOW.exe'
          if (-not (Test-Path $exe)) { throw 'Portable memoNOW.exe was not created.' }
          Get-Item $exe | Select-Object Name, Length, LastWriteTime

      - name: Upload portable EXE as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: memoNOW-win-x64-portable
          path: artifacts/memoNOW-win-x64/memoNOW.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish anonymous latest GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = '.\artifacts\memoNOW-win-x64\memoNOW.exe'
          $repo = $env:GITHUB_REPOSITORY
          $sha = $env:GITHUB_SHA
          $notes = 'Latest portable Windows build from the main branch. Public download; no GitHub login or .NET installation is required.'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -f latest $sha
          git push --force origin refs/tags/latest

          gh release view latest --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload latest $exe --clobber --repo $repo
            gh release edit latest --repo $repo --title 'memoNOW latest' --notes $notes --prerelease=false --latest
          }
          else {
            gh release create latest $exe --repo $repo --target $sha --title 'memoNOW latest' --notes $notes --latest
          }
